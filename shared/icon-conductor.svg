<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 18 448 448">
  <title>Mi Ruta — logo opción 3</title>
  <desc>Icono verde petróleo con autobús blanco, pin GPS amarillo y ondas de señal amarillas, acompañado por el nombre Mi Ruta.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08736F"/>
      <stop offset="1" stop-color="#075E60"/>
    </linearGradient>
  </defs>
  <!-- App icon -->
  <rect x="32" y="18" width="448" height="448" rx="100" fill="url(#teal)"/>
  <!-- GPS signal waves -->
  <g fill="none" stroke="#FFC21C" stroke-width="15" stroke-linecap="round">
    <path d="M151 104 C113 129 91 168 82 213 C74 253 85 294 112 329"/>
    <path d="M174 143 C147 165 132 196 128 229 C124 255 131 278 145 299"/>
    <path d="M361 104 C399 129 421 168 430 213 C438 253 427 294 400 329"/>
    <path d="M338 143 C365 165 380 196 384 229 C388 255 381 278 367 299"/>
  </g>
  <!-- Location pin -->
  <path d="M256 56 C230 56 211 76 211 101 C211 132 256 177 256 177 C256 177 301 132 301 101 C301 76 282 56 256 56 Z" fill="#FFC21C"/>
  <circle cx="256" cy="101" r="12" fill="#086A68"/>
  <!-- Bus body and side mirrors -->
  <g fill="#FFFDF8">
    <rect x="183" y="196" width="146" height="193" rx="29"/>
    <rect x="169" y="241" width="22" height="40" rx="8"/>
    <rect x="321" y="241" width="22" height="40" rx="8"/>
    <rect x="197" y="367" width="27" height="34" rx="10"/>
    <rect x="288" y="367" width="27" height="34" rx="10"/>
  </g>
  <!-- Front windshield -->
  <rect x="199" y="230" width="114" height="72" rx="11" fill="#086A68"/>
  <!-- Destination display -->
  <rect x="229" y="211" width="54" height="8" rx="4" fill="#086A68"/>
  <!-- Headlights -->
  <circle cx="211" cy="333" r="10" fill="#086A68"/>
  <circle cx="301" cy="333" r="10" fill="#086A68"/>
  <!-- Bumper -->
  <rect x="235" y="350" width="42" height="7" rx="3.5" fill="#086A68"/>
  
  
</svg>
